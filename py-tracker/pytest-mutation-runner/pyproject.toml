[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-mutation-runner"
version = "0.1.0"
description = "Pytest plugin for program/mutant runs with timeout control"
authors = [
  { name = "Taha Rostami" }
]
requires-python = ">=3.5"

dependencies = [
  "pytest-timeout>=2.4.0",
]

[project.entry-points.pytest11]
mutation_runner = "pytest_mutation_runner.plugin"
