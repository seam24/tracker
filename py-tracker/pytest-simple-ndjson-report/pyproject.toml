[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-simple-ndjson-report"
version = "0.1.0"
description = "A tiny pytest plugin that writes a single NDJSON line per run (mutation-testing friendly)."

requires-python = ">=3.4"
keywords = ["pytest", "plugin", "reporting", "ndjson", "mutation-testing"]
classifiers = [
  "Framework :: Pytest",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]

dependencies = ["pytest>=3.3"]

[project.entry-points.pytest11]
simple_ndjson_report = "pytest_simple_ndjson_report.plugin"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]