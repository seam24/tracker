[metadata]
name = pytest-simple-ndjson-report
version = 0.1.0
description = A tiny pytest plugin that writes a single NDJSON line per run (mutation-testing friendly).


keywords = pytest, plugin, reporting, ndjson, mutation-testing
classifiers =
    Framework :: Pytest
    Programming Language :: Python
    Programming Language :: Python :: 3
    Topic :: Software Development :: Testing

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.4
install_requires =
    pytest>=3.3
include_package_data = True

[options.packages.find]
where = src

[options.entry_points]
pytest11 =
    simple_ndjson_report = pytest_simple_ndjson_report.plugin